[package]
name = "frances-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Exposes `test_util::StubProvider` and `ProviderCache::insert_stub` so
# downstream test suites can drive `ChatSession::run` without standing
# up a real wire-level provider.
test-util = []

[dependencies]
async-trait.workspace = true
dashmap.workspace = true
frances-config.workspace = true
frances-core.workspace = true
frances-models-llm.workspace = true
futures.workspace = true
futures-util.workspace = true
genai.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
frances-config = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
