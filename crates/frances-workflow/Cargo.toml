[package]
name = "frances-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
dashmap.workspace = true
deno_ast.workspace = true
frances-core.workspace = true
frances-edit.workspace = true
frances-models-llm.workspace = true
frances-models-tui.workspace = true
frances-shell.workspace = true
frances-storage.workspace = true
globset.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
jaq-core.workspace = true
jaq-json.workspace = true
jaq-std.workspace = true
parking_lot.workspace = true
rquickjs.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
shell-words.workspace = true
thiserror.workspace = true
tracing.workspace = true
turso.workspace = true
twox-hash.workspace = true
uuid.workspace = true

[features]
# Exposes the in-memory test deps (`StubDeps`, `StubManager`,
# `StubEditorFactory`, ...) for integration tests in downstream crates
# or in this crate's own `tests/` directory.
test-utils = ["frances-edit/test-utils"]

[dev-dependencies]
frances-workflow = { path = ".", features = ["test-utils"] }
frances-edit = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
