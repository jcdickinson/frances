[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Frances Contributors"]
license = "MIT"
repository = "https://github.com/jono/frances"

[workspace.dependencies]
frances-anchors = { path = "crates/frances-anchors" }
frances-config = { path = "crates/frances-config" }
frances-core = { path = "crates/frances-core" }
frances-daemon = { path = "crates/frances-daemon" }
frances-edit = { path = "crates/frances-edit" }
frances-llm = { path = "crates/frances-llm" }
frances-models-llm = { path = "crates/frances-models-llm" }
frances-shell = { path = "crates/frances-shell" }
frances-storage = { path = "crates/frances-storage" }
frances-tui = { path = "crates/frances-tui" }
frances-workflow = { path = "crates/frances-workflow" }

anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
bincode = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dashmap = "6"
deno_ast = { version = "0.53", features = ["transpiling"] }
futures = "0.3"
futures-util = "0.3"
getrandom = "0.2"
jaq-core = "3"
jaq-json = "2"
jaq-std = "3"
libc = "0.2"
parking_lot = "0.12"
ratatui = { version = "0.30", features = ["unstable-backend-writer", "unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rquickjs = { version = "0.11", features = ["futures", "loader", "parallel", "macro"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
shellexpand = "3"
similar = { version = "3.1", default-features = false }
slotmap = "1"
smallvec = "1"
tarpc = { version = "0.37", features = ["tokio1", "serde1", "serde-transport", "serde-transport-bincode", "unix"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turso = { version = "0.6.0-pre.26", default-features = false }
twox-hash = { version = "2.1.2", default-features = false, features = ["xxhash3_64"] }
unicode-width = "0.2"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
xdg = "3"
