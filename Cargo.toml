[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Frances Contributors"]
license = "MIT"
repository = "https://github.com/jono/frances"

[workspace.dependencies]
frances-anchors = { path = "crates/frances-anchors" }
frances-config = { path = "crates/frances-config" }
frances-core = { path = "crates/frances-core" }
frances-session = { path = "crates/frances-session" }
frances-edit = { path = "crates/frances-edit" }
frances-llm = { path = "crates/frances-llm" }
frances-models-llm = { path = "crates/frances-models-llm" }
frances-models-ui = { path = "crates/frances-models-ui" }
frances-shell = { path = "crates/frances-shell" }
frances-storage = { path = "crates/frances-storage" }
frances-workflow = { path = "crates/frances-workflow" }
frances-worker = { path = "crates/frances-worker" }
frances-worker-protocol = { path = "crates/frances-worker-protocol" }

anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
base64 = "0.22"
bincode = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dashmap = "6"
deno_ast = { version = "0.53", features = ["transpiling"] }
futures = "0.3"
futures-util = "0.3"
getrandom = "0.2"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
jaq-core = "3"
jaq-json = "2"
jaq-std = "3"
libc = "0.2"
genai = "0.6.0-beta.20"
chrono = "0.4"
gdk = "0.18"
gtk = "0.18"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
regex = "1"
rquickjs = { version = "0.11", features = ["futures", "loader", "macro"] }
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
shellexpand = "3"
similar = { version = "3.1", default-features = false }
slotmap = "1"
smallvec = "1"
specta = { version = "2.0.0-rc.22", features = ["derive", "serde", "serde_json", "uuid"] }
specta-typescript = "0.0.9"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", default-features = false }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turso = { version = "0.6.0-pre.26", default-features = false }
twox-hash = { version = "2.1.2", default-features = false, features = ["xxhash3_64"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
xdg = "3"
