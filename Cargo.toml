[workspace]
members = ["crates/frances"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Frances Contributors"]
license = "MIT"
repository = "https://github.com/jono/frances"

[workspace.dependencies]
anyhow = "1"
bincode = { version = "2", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
llm = { version = "1.3.8", default-features = false, features = ["openai", "rustls-tls"] }
turso = { version = "0.6.0-pre.26", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
tui-textarea = { package = "tui-textarea-2", version = "0.10" }
